<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菲菲的小厨房</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header class="hero"><div class="topbar"><div class="brand"><span>♡</span> 菲菲的小厨房</div><div class="top-actions"><button class="manage-top" id="manageTop">⚙ 主厨管理</button><button class="cart-top" id="topCart">🛒 <span id="topCount">0</span></button></div></div><div class="hero-copy"><div class="eyebrow">TODAY'S LOVE MENU</div><h1>菲菲，今天想吃点什么？</h1><p>认真吃饭，好好生活。菲菲负责点菜，陈永富负责把喜欢都端到你面前。</p><div class="status"><i></i>今日厨房营业中 · 主厨陈永富随时待命</div></div><div class="hero-art"><div class="plate"><span>🍝</span></div><div class="spark s1">✦</div><div class="spark s2">♥</div><div class="spark s3">✦</div></div></header>
<section class="menu-section"><div class="section-heading"><div><span class="mini-title">MENU</span><h2>今天的菜单</h2></div><p>每一道，都是想和你一起吃的味道</p></div><nav class="categories" id="categories"></nav><div class="dish-grid" id="dishGrid"></div></section>
<footer><span>♡</span><p>好好吃饭，是我们最浪漫的小事</p><small>LOVE IS ALWAYS ON THE MENU</small></footer>
<button class="floating-cart" id="floatingCart" hidden><span>🛍️ <b id="floatCount">0</b></span><span>查看已选 · ¥<i id="floatTotal">0</i>　›</span></button>
<div class="overlay" id="overlay" hidden><aside class="cart-panel"><div class="panel-head"><div><span>FEIFEI'S ORDER</span><h2>菲菲选好了</h2></div><button id="closeCart">×</button></div><div class="cart-list" id="cartList"></div><label class="note-label">给陈永富的小纸条<textarea id="orderNote" placeholder="比如：少辣、不要香菜、想要多一点爱…"></textarea></label><div class="total-row"><span id="totalCount">共 0 份</span><strong id="totalPrice">合计 ¥0</strong></div><div class="submit-actions"><button class="share-wechat" id="shareWechat">微信分享</button><button class="submit" id="submitOrder">告诉陈永富，就吃这些 ♥</button></div></aside></div>
<div class="toast" id="toast" hidden><span>♥</span><div><b id="toastTitle">主厨陈永富收到啦！</b><small id="toastText">今晚为菲菲认真下厨</small></div><button id="closeToast">×</button></div></main>
<div class="overlay admin-overlay" id="adminOverlay" hidden><aside class="admin-panel"><div class="panel-head"><div><span>CHEF ONLY</span><h2>陈永富的菜单管理</h2></div><button id="closeAdmin">×</button></div><section id="loginSection" class="admin-login"><p>登录后修改的菜单，菲菲会立即看到。</p><label>主厨邮箱<input id="adminEmail" type="email" placeholder="请输入邮箱"></label><label>登录密码<input id="adminPassword" type="password" placeholder="请输入密码"></label><button class="admin-primary" id="adminLogin">主厨登录</button><small id="loginError"></small></section><section id="manageSection" hidden><form id="dishForm" class="dish-form"><h3 id="formTitle">添加新菜</h3><div class="form-grid"><label>菜名<input id="dishName" required placeholder="例如：红烧排骨"></label><label>价格<input id="dishPrice" required type="number" min="0" step="0.01" placeholder="38"></label><label>分类<select id="dishCategory"><option>热菜</option><option>小吃</option><option>饮品</option><option>甜品</option></select></label><label>图标<input id="dishEmoji" maxlength="4" placeholder="🍖"></label><label class="wide">菜品介绍<input id="dishDesc" placeholder="软烂入味，香浓下饭"></label><label class="wide">推荐标签<input id="dishTag" placeholder="例如：菲菲推荐（可留空）"></label></div><div class="form-actions"><button type="button" id="cancelEdit" hidden>取消编辑</button><button class="admin-primary" type="submit" id="saveDish">保存菜品</button></div></form><div class="admin-list-head"><h3>当前菜单</h3><button id="adminLogout">退出登录</button></div><div class="admin-dishes" id="adminDishes"></div></section></aside></div>
<script>
const SUPABASE_URL='https://wmkzsbdcjjedjcefilhl.supabase.co';
const SUPABASE_KEY='sb_publishable_KL_49awW0F70_P7m89CTJQ_oYJt3MP4';
let dishes=[['番茄牛腩','软烂牛腩配酸甜番茄汤汁',36,'🍅','热菜','她的最爱',1],['可乐鸡翅','甜咸入味，一口脱骨',28,'🍗','热菜','招牌',2],['蒜蓉西兰花','清脆爽口，蒜香十足',16,'🥦','热菜','',3],['香煎三文鱼','外焦里嫩，柠檬提鲜',42,'🐟','热菜','',4],['爱心煎蛋','今天也要给你满分爱意',8,'🍳','小吃','限定',5],['薯条拼盘','酥脆薯条配番茄酱',18,'🍟','小吃','',6],['草莓奶昔','新鲜草莓，甜度刚刚好',15,'🍓','饮品','推荐',7],['柠檬气泡水','清爽解腻，满杯气泡',12,'🍋','饮品','',8],['提拉米苏','咖啡香与奶油的温柔相遇',22,'🍰','甜品','饭后必点',9],['焦糖布丁','嫩滑香甜，入口即化',16,'🍮','甜品','',10]];
let active='全部',cart={}; const cats=['全部','热菜','小吃','饮品','甜品'];
function stats(){let n=0,t=0;dishes.forEach((d,i)=>{n+=(cart[i]||0);t+=(cart[i]||0)*d[2]});return[n,t]}
function change(i,v){cart[i]=Math.max(0,(cart[i]||0)+v);if(!cart[i])delete cart[i];render()}
function render(){document.getElementById('categories').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');document.getElementById('dishGrid').innerHTML=dishes.map((d,i)=>[d,i]).filter(([d])=>active==='全部'||d[4]===active).map(([d,i])=>`<article class="dish-card"><div class="dish-visual"><span>${d[3]}</span>${d[5]?`<b>${d[5]}</b>`:''}</div><div class="dish-info"><h3>${d[0]}</h3><p>${d[1]}</p><div class="dish-bottom"><strong>¥${d[2]}</strong>${cart[i]?`<div class="counter"><button data-index="${i}" data-change="-1">−</button><span>${cart[i]}</span><button data-index="${i}" data-change="1">＋</button></div>`:`<button class="add" data-index="${i}" data-change="1">＋</button>`}</div></div></article>`).join('');let[n,t]=stats();topCount.textContent=floatCount.textContent=n;floatTotal.textContent=t;floatingCart.hidden=!n;totalCount.textContent=`共 ${n} 份`;totalPrice.textContent=`合计 ¥${t}`;cartList.innerHTML=n?dishes.map((d,i)=>cart[i]?`<div class="cart-row"><div class="cart-emoji">${d[3]}</div><div><h3>${d[0]}</h3><small>¥${d[2]}</small></div><div class="counter"><button data-index="${i}" data-change="-1">−</button><span>${cart[i]}</span><button data-index="${i}" data-change="1">＋</button></div></div>`:'').join(''):'<div class="empty">还没有选菜哦～</div>'}
function showToast(title,text){toastTitle.textContent=title;toastText.textContent=text;toast.hidden=false}
function orderMessage(){let[n,t]=stats();let lines=dishes.map((d,i)=>cart[i]?`• ${d[0]} × ${cart[i]}`:'').filter(Boolean);let note=orderNote.value.trim();return `菲菲今天想吃：\n${lines.join('\n')}\n\n共 ${n} 份，合计 ¥${t}${note?`\n备注：${note}`:''}\n\n主厨陈永富，请接单 ♥`}
async function shareToWechat(){if(!stats()[0])return;let text=orderMessage();try{if(navigator.share){await navigator.share({title:'菲菲的今日菜单',text,url:location.href});showToast('分享面板已打开','请选择微信好友发送')}else{await navigator.clipboard.writeText(text);showToast('菜单已复制','打开微信粘贴给陈永富即可')}}catch(e){if(e.name!=='AbortError'){try{await navigator.clipboard.writeText(text);showToast('菜单已复制','打开微信粘贴发送即可')}catch{showToast('暂时无法直接分享','请截图菜单后发送到微信')}}}}
async function loadDishes(){try{let r=await fetch(`${SUPABASE_URL}/rest/v1/dishes?select=*&order=sort_order.asc`,{headers:{apikey:SUPABASE_KEY}});if(!r.ok)throw 0;let rows=await r.json();if(rows.length)dishes=rows.map(x=>[x.name,x.description,Number(x.price),x.emoji,x.category,x.tag||'',x.id]);cart={};render();renderAdmin()}catch{showToast('暂时使用本地菜单','云端连接恢复后会自动同步')}}
let adminToken=localStorage.getItem('feifei_admin_token')||'',editDishId=null;
function openAdmin(){adminOverlay.hidden=false;showAdminState()}
function showAdminState(){loginSection.hidden=!!adminToken;manageSection.hidden=!adminToken;if(adminToken)renderAdmin()}
function renderAdmin(){if(!adminDishes)return;adminDishes.innerHTML=dishes.map(d=>`<div class="admin-dish"><span>${d[3]}</span><div><b>${d[0]}</b><small>${d[4]} · ¥${d[2]}</small></div><button data-edit-dish="${d[6]}">编辑</button><button class="danger" data-delete-dish="${d[6]}">删除</button></div>`).join('')}
async function adminRequest(path,options={}){let r=await fetch(`${SUPABASE_URL}${path}`,{...options,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${adminToken}`,'Content-Type':'application/json',Prefer:'return=minimal',...(options.headers||{})}});if(r.status===401){adminToken='';localStorage.removeItem('feifei_admin_token');showAdminState();throw new Error('登录已过期')}if(!r.ok)throw new Error(await r.text());return r}
async function loginAdmin(){loginError.textContent='登录中…';let r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:adminEmail.value.trim(),password:adminPassword.value})});let data=await r.json();if(!r.ok){loginError.textContent='邮箱或密码不正确';return}adminToken=data.access_token;localStorage.setItem('feifei_admin_token',adminToken);loginError.textContent='';showAdminState();showToast('主厨登录成功','现在可以管理云端菜单了')}
function resetDishForm(){editDishId=null;dishForm.reset();formTitle.textContent='添加新菜';cancelEdit.hidden=true}
function startEdit(id){let d=dishes.find(x=>String(x[6])===String(id));if(!d)return;editDishId=id;dishName.value=d[0];dishDesc.value=d[1];dishPrice.value=d[2];dishEmoji.value=d[3];dishCategory.value=d[4];dishTag.value=d[5];formTitle.textContent='编辑菜品';cancelEdit.hidden=false;adminOverlay.querySelector('.admin-panel').scrollTo({top:0,behavior:'smooth'})}
async function saveDishCloud(e){e.preventDefault();let payload={name:dishName.value.trim(),description:dishDesc.value.trim(),price:Number(dishPrice.value),emoji:dishEmoji.value.trim()||'🍽️',category:dishCategory.value,tag:dishTag.value.trim()||null,sort_order:editDishId?(dishes.findIndex(x=>String(x[6])===String(editDishId))+1):(dishes.length+1)};saveDish.disabled=true;try{await adminRequest(`/rest/v1/dishes${editDishId?`?id=eq.${editDishId}`:''}`,{method:editDishId?'PATCH':'POST',body:JSON.stringify(payload)});resetDishForm();await loadDishes();showToast('菜单已同步','菲菲刷新页面就能看到')}catch(e){showToast('保存失败',e.message)}finally{saveDish.disabled=false}}
async function deleteDishCloud(id){if(!confirm('确定删除这道菜吗？'))return;try{await adminRequest(`/rest/v1/dishes?id=eq.${id}`,{method:'DELETE'});await loadDishes();showToast('菜品已删除','云端菜单已同步')}catch(e){showToast('删除失败',e.message)}}
function openCart(){overlay.hidden=false} topCart.addEventListener('click',openCart);floatingCart.addEventListener('click',openCart);manageTop.addEventListener('click',openAdmin);closeAdmin.addEventListener('click',()=>adminOverlay.hidden=true);adminOverlay.addEventListener('click',e=>{if(e.target===adminOverlay)adminOverlay.hidden=true});adminLogin.addEventListener('click',loginAdmin);adminLogout.addEventListener('click',()=>{adminToken='';localStorage.removeItem('feifei_admin_token');showAdminState()});dishForm.addEventListener('submit',saveDishCloud);cancelEdit.addEventListener('click',resetDishForm);closeCart.addEventListener('click',()=>overlay.hidden=true);closeToast.addEventListener('click',()=>toast.hidden=true);shareWechat.addEventListener('click',shareToWechat);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.hidden=true});submitOrder.addEventListener('click',()=>{if(stats()[0]){overlay.hidden=true;showToast('主厨陈永富收到啦！','今晚为菲菲认真下厨')}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat){active=b.dataset.cat;render()}if(b.dataset.index!==undefined)change(Number(b.dataset.index),Number(b.dataset.change));if(b.dataset.editDish)startEdit(b.dataset.editDish);if(b.dataset.deleteDish)deleteDishCloud(b.dataset.deleteDish)});render();loadDishes();
</script></body></html>
