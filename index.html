<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菲菲的小厨房</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header class="hero"><div class="topbar"><div class="brand"><span>♡</span> 菲菲的小厨房</div><button class="cart-top" id="topCart">🛒 <span id="topCount">0</span></button></div><div class="hero-copy"><div class="eyebrow">TODAY'S LOVE MENU</div><h1>菲菲，今天想吃点什么？</h1><p>认真吃饭，好好生活。菲菲负责点菜，陈永富负责把喜欢都端到你面前。</p><div class="status"><i></i>今日厨房营业中 · 主厨陈永富随时待命</div></div><div class="hero-art"><div class="plate"><span>🍝</span></div><div class="spark s1">✦</div><div class="spark s2">♥</div><div class="spark s3">✦</div></div></header>
<section class="menu-section"><div class="section-heading"><div><span class="mini-title">MENU</span><h2>今天的菜单</h2></div><p>每一道，都是想和你一起吃的味道</p></div><nav class="categories" id="categories"></nav><div class="dish-grid" id="dishGrid"></div></section>
<footer><span>♡</span><p>好好吃饭，是我们最浪漫的小事</p><small>LOVE IS ALWAYS ON THE MENU</small></footer>
<button class="floating-cart" id="floatingCart" hidden><span>🛍️ <b id="floatCount">0</b></span><span>查看已选 · ¥<i id="floatTotal">0</i>　›</span></button>
<div class="overlay" id="overlay" hidden><aside class="cart-panel"><div class="panel-head"><div><span>FEIFEI'S ORDER</span><h2>菲菲选好了</h2></div><button id="closeCart">×</button></div><div class="cart-list" id="cartList"></div><label class="note-label">给陈永富的小纸条<textarea placeholder="比如：少辣、不要香菜、想要多一点爱…"></textarea></label><div class="total-row"><span id="totalCount">共 0 份</span><strong id="totalPrice">合计 ¥0</strong></div><button class="submit" id="submitOrder">告诉陈永富，就吃这些 ♥</button></aside></div>
<div class="toast" id="toast" hidden><span>♥</span><div><b>主厨陈永富收到啦！</b><small>今晚为菲菲认真下厨</small></div><button id="closeToast">×</button></div></main>
<script>
const dishes=[['番茄牛腩','软烂牛腩配酸甜番茄汤汁',36,'🍅','热菜','她的最爱'],['可乐鸡翅','甜咸入味，一口脱骨',28,'🍗','热菜','招牌'],['蒜蓉西兰花','清脆爽口，蒜香十足',16,'🥦','热菜',''],['香煎三文鱼','外焦里嫩，柠檬提鲜',42,'🐟','热菜',''],['爱心煎蛋','今天也要给你满分爱意',8,'🍳','小吃','限定'],['薯条拼盘','酥脆薯条配番茄酱',18,'🍟','小吃',''],['草莓奶昔','新鲜草莓，甜度刚刚好',15,'🍓','饮品','推荐'],['柠檬气泡水','清爽解腻，满杯气泡',12,'🍋','饮品',''],['提拉米苏','咖啡香与奶油的温柔相遇',22,'🍰','甜品','饭后必点'],['焦糖布丁','嫩滑香甜，入口即化',16,'🍮','甜品','']];
let active='全部',cart={}; const cats=['全部','热菜','小吃','饮品','甜品'];
function stats(){let n=0,t=0;dishes.forEach((d,i)=>{n+=(cart[i]||0);t+=(cart[i]||0)*d[2]});return[n,t]}
function change(i,v){cart[i]=Math.max(0,(cart[i]||0)+v);if(!cart[i])delete cart[i];render()}
function render(){document.getElementById('categories').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" data-cat="${c}">${c}</button>`).join('');document.getElementById('dishGrid').innerHTML=dishes.map((d,i)=>[d,i]).filter(([d])=>active==='全部'||d[4]===active).map(([d,i])=>`<article class="dish-card"><div class="dish-visual"><span>${d[3]}</span>${d[5]?`<b>${d[5]}</b>`:''}</div><div class="dish-info"><h3>${d[0]}</h3><p>${d[1]}</p><div class="dish-bottom"><strong>¥${d[2]}</strong>${cart[i]?`<div class="counter"><button data-index="${i}" data-change="-1">−</button><span>${cart[i]}</span><button data-index="${i}" data-change="1">＋</button></div>`:`<button class="add" data-index="${i}" data-change="1">＋</button>`}</div></div></article>`).join('');let[n,t]=stats();topCount.textContent=floatCount.textContent=n;floatTotal.textContent=t;floatingCart.hidden=!n;totalCount.textContent=`共 ${n} 份`;totalPrice.textContent=`合计 ¥${t}`;cartList.innerHTML=n?dishes.map((d,i)=>cart[i]?`<div class="cart-row"><div class="cart-emoji">${d[3]}</div><div><h3>${d[0]}</h3><small>¥${d[2]}</small></div><div class="counter"><button data-index="${i}" data-change="-1">−</button><span>${cart[i]}</span><button data-index="${i}" data-change="1">＋</button></div></div>`:'').join(''):'<div class="empty">还没有选菜哦～</div>'}
function openCart(){overlay.hidden=false} topCart.addEventListener('click',openCart);floatingCart.addEventListener('click',openCart);closeCart.addEventListener('click',()=>overlay.hidden=true);closeToast.addEventListener('click',()=>toast.hidden=true);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.hidden=true});submitOrder.addEventListener('click',()=>{if(stats()[0]){overlay.hidden=true;toast.hidden=false}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat){active=b.dataset.cat;render()}if(b.dataset.index!==undefined)change(Number(b.dataset.index),Number(b.dataset.change))});render();
</script></body></html>
